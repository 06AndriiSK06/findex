name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Pyright strict type check
        run: uv run pyright

      - name: Run pytest with coverage
        run: uv run pytest -m "not slow" --benchmark-disable --cov=findex --cov-report=term-missing

      - name: Run pytest-benchmark suite
        run: uv run pytest --benchmark-only --benchmark-min-rounds=5
